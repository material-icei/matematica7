<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guardianes de la Geometría</title>
  <meta name="description" content="Aventura matemática de geometría para 7.º grado.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
/* =========================================================
   Guardianes de la Geometría — estilos
   Diseño horizontal 16:9 · referencia 1366 × 768 (Chromebook)
   ========================================================= */
:root {
  --night: #0a1324;
  --ink: #0f1c35;
  --panel: #142545;
  --panel-2: #1b3160;
  --line: #2b4579;
  --text: #eef3ff;
  --muted: #a9b9da;
  --paper: #fbf8f1;
  --paper-2: #f2ede1;
  --paper-ink: #1b2233;
  --paper-muted: #545c70;
  --paper-line: #ddd5c3;
  --amber: #ffbf3c;
  --amber-ink: #7a4d00;
  --cyan: #3fd6c6;
  --cyan-ink: #0a6a62;
  --coral: #ff6d5e;
  --violet: #9b8cff;
  --violet-ink: #4a3bd0;
  --ok: #0d7a50;
  --ok-bg: #e2f5ea;
  --bad: #b3261e;
  --bad-bg: #fde9e6;
  --hint: #6e4700;
  --hint-bg: #fff2d3;
  --r: 16px;
  --font: 'Lexend', 'Segoe UI', Roboto, system-ui, sans-serif;
  --font-d: 'Space Grotesk', 'Lexend', Roboto, system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { font-size: clamp(13px, min(1.22vw, 2.55vh), 18px); }
body {
  margin: 0; height: 100vh; overflow: hidden; color: var(--text); font-family: var(--font); line-height: 1.4;
  background-color: var(--night);
  background-image:
    radial-gradient(ellipse at 15% -10%, rgba(63, 214, 198, .16), transparent 55%),
    radial-gradient(ellipse at 95% 110%, rgba(155, 140, 255, .16), transparent 55%),
    linear-gradient(rgba(120, 170, 255, .07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(120, 170, 255, .07) 1px, transparent 1px);
  background-size: auto, auto, 2rem 2rem, 2rem 2rem;
}
button, input, select { font: inherit; color: inherit; }
b, strong { font-weight: 600; }
a { color: var(--cyan); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; border-radius: 6px; }
.paper :focus-visible, .modal :focus-visible { outline-color: var(--violet-ink); }

#app { height: 100vh; display: flex; flex-direction: column; }
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; animation: fadein .25s ease; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

/* ---------- íconos y botones ---------- */
.ic { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.22em; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5em; min-height: 2.75rem; padding: .55rem 1.25rem;
  border-radius: 999px; border: 2px solid transparent; font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap;
  transition: transform .12s ease, background-color .15s ease, box-shadow .15s ease;
}
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--amber); color: #241800; box-shadow: 0 3px 0 #b07c11; }
.btn-primary:hover:not(:disabled) { background: #ffcd60; }
.btn-ghost { background: rgba(255, 255, 255, .06); border-color: rgba(255, 255, 255, .22); color: var(--text); }
.btn-ghost:hover { background: rgba(255, 255, 255, .12); }
.btn-ghost-dark { background: #fff; border-color: #c9c1ad; color: var(--paper-ink); }
.btn-ghost-dark:hover { background: var(--paper-2); }
.btn-hint { background: var(--hint-bg); border-color: #e9c26b; color: var(--hint); }
.btn-small { min-height: 2.2rem; padding: .3rem .9rem; font-size: .9rem; }
.btn-big { min-height: 3.3rem; padding: .7rem 2rem; font-size: 1.15rem; }
.ib { width: 2.2rem; height: 2.2rem; border-radius: 10px; border: 2px solid #c9c1ad; background: #fff; cursor: pointer; font-size: .9rem; color: var(--paper-ink); display: inline-grid; place-items: center; }
.ib:disabled { opacity: .3; cursor: default; }
.chip { display: inline-flex; align-items: center; gap: .35em; padding: .25rem .7rem; border-radius: 999px; font-size: .88rem; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .16); white-space: nowrap; }
.chip-amber { background: rgba(255, 191, 60, .16); border-color: rgba(255, 191, 60, .45); color: #ffe1a0; }
.chip-paper { background: #fff; border-color: var(--paper-line); color: var(--paper-ink); }
.chip-coral { background: #ffe6e2; border-color: #f3b0a8; color: #8d2116; }
.chip-violet { background: #ece9ff; border-color: #c4bcff; color: #3a2db0; }
.paper .chip-amber { background: #fff3d6; border-color: #eccb82; color: var(--amber-ink); }

/* ---------- barra superior ---------- */
.topbar { display: flex; align-items: center; gap: .8rem; padding: .55rem 1.2rem; min-height: 3.4rem; border-bottom: 1px solid rgba(255, 255, 255, .08); background: rgba(10, 19, 36, .6); backdrop-filter: blur(4px); }
.brand { display: flex; align-items: center; gap: .6rem; font-family: var(--font-d); font-weight: 700; letter-spacing: .01em; }
.brand-mark { width: 2rem; height: 2rem; }
.topbar .spacer { flex: 1; }
.tb-title { display: flex; align-items: center; gap: .55rem; font-weight: 600; min-width: 0; }
.tb-title span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tb-title .ic { color: var(--cyan); width: 1.5em; height: 1.5em; }
.steps { display: flex; gap: .3rem; align-items: center; }
.step { width: .8rem; height: .8rem; border-radius: 50%; background: rgba(255, 255, 255, .18); display: inline-block; }
.step.cur { background: var(--amber); box-shadow: 0 0 0 3px rgba(255, 191, 60, .28); }
.step.s1, .step.s3 { background: var(--cyan); }
.step.s2 { background: #8fd0ff; }
.step.w { background: var(--coral); }
.step.self { background: var(--violet); }
.xp { font-family: var(--font-d); font-weight: 700; color: var(--amber); }

/* ---------- bienvenida ---------- */
.welcome { flex: 1; display: grid; grid-template-columns: 1.1fr 1fr; align-items: center; gap: 2rem; padding: 2rem 4rem; min-height: 0; }
.welcome-art { display: grid; place-items: center; min-height: 0; height: 100%; }
.welcome-art svg { width: 100%; height: 100%; max-height: 32rem; }
.eyebrow { text-transform: uppercase; letter-spacing: .18em; font-size: .78rem; color: var(--cyan); font-weight: 600; }
.welcome h1 { font-family: var(--font-d); font-size: 2.9rem; line-height: 1.03; margin: .4rem 0 .8rem; }
.welcome h1 em { font-style: normal; color: var(--amber); }
.lead { color: var(--muted); font-size: 1.12rem; max-width: 32rem; margin: 0 0 1.4rem; }
.field { display: flex; flex-direction: column; gap: .35rem; margin-bottom: 1rem; max-width: 26rem; }
.field label { font-weight: 600; font-size: .95rem; }
.field input { height: 3rem; border-radius: 12px; border: 2px solid var(--line); background: var(--ink); padding: 0 1rem; font-size: 1.1rem; }
.field input:focus { border-color: var(--amber); outline: none; box-shadow: 0 0 0 3px rgba(255, 191, 60, .25); }
.field .help { font-size: .82rem; color: var(--muted); }
.field .err { font-size: .88rem; color: #ffb4a9; min-height: 1.2em; }
.row { display: flex; gap: .7rem; flex-wrap: wrap; align-items: center; }
.note { font-size: .85rem; color: var(--muted); margin-top: 1rem; max-width: 30rem; }
.continue-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 1rem 1.2rem; max-width: 30rem; margin-bottom: 1rem; }
.continue-card p { margin: .2rem 0 .8rem; color: var(--muted); }

/* ---------- mapa ---------- */
.mapwrap { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 22rem; gap: 1rem; padding: .8rem 1.2rem 1rem; }
.map { position: relative; border-radius: var(--r); background: linear-gradient(160deg, rgba(27, 49, 96, .65), rgba(15, 28, 53, .85)); border: 1px solid var(--line); overflow: hidden; min-height: 0; }
.map-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.map-path { fill: none; stroke: rgba(255, 255, 255, .16); stroke-width: 3; stroke-dasharray: 2 9; stroke-linecap: round; }
.map-path-done { fill: none; stroke: var(--cyan); stroke-width: 3.5; stroke-linecap: round; }
.zone { position: absolute; font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: rgba(169, 185, 218, .8); font-weight: 600; transform: translateX(-50%); white-space: nowrap; }
.node {
  position: absolute; transform: translate(-50%, -50%); width: 5.1rem; height: 5.1rem; border-radius: 50%;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .05rem;
  border: 3px solid var(--line); background: var(--panel); cursor: pointer; color: var(--text); padding: 0;
  transition: transform .15s ease, box-shadow .15s ease;
}
.node .ic { width: 1.7rem; height: 1.7rem; }
.node .num { font-size: .72rem; font-weight: 700; opacity: .85; }
.node:hover { transform: translate(-50%, -50%) scale(1.06); }
.node.avail { border-color: var(--amber); background: radial-gradient(circle at 35% 30%, #2a4a8c, var(--panel)); box-shadow: 0 0 0 6px rgba(255, 191, 60, .14), 0 0 24px rgba(255, 191, 60, .28); }
.node.avail .ic { color: var(--amber); }
.node.done { border-color: var(--cyan); background: radial-gradient(circle at 35% 30%, #1d5a6b, #133a4c); }
.node.done .ic { color: var(--cyan); }
.node.locked { opacity: .55; border-style: dashed; }
.node.final { width: 6.2rem; height: 6.2rem; }
.node.sel { outline: 3px solid #fff; outline-offset: 4px; }
.node-stars { position: absolute; bottom: -1.15rem; display: flex; gap: 1px; color: var(--amber); }
.node-stars .ic { width: .9rem; height: .9rem; fill: var(--amber); stroke: var(--amber); stroke-width: 1; }
.node-stars .ic.off { fill: none; stroke: rgba(255, 255, 255, .35); }
.node .lock { position: absolute; top: -.3rem; right: -.3rem; width: 1.6rem; height: 1.6rem; border-radius: 50%; background: var(--night); border: 2px solid var(--line); display: grid; place-items: center; }
.node .lock .ic { width: .9rem; height: .9rem; color: var(--muted); }

.side { background: var(--paper); color: var(--paper-ink); border-radius: var(--r); padding: 1.1rem 1.2rem; display: flex; flex-direction: column; gap: .7rem; min-height: 0; overflow: auto; }
.side h2 { margin: 0; font-family: var(--font-d); font-size: 1.45rem; line-height: 1.15; }
.side .kicker { font-size: .8rem; text-transform: uppercase; letter-spacing: .12em; color: var(--paper-muted); font-weight: 600; display: flex; align-items: center; gap: .4rem; }
.side .desc { margin: 0; color: var(--paper-muted); }
.status { display: inline-flex; align-items: center; gap: .35rem; font-weight: 600; font-size: .88rem; padding: .25rem .7rem; border-radius: 999px; align-self: flex-start; }
.status.locked { background: #eceae4; color: #5a5f6d; }
.status.avail { background: #fff1cf; color: var(--amber-ink); }
.status.done { background: var(--ok-bg); color: var(--ok); }
.status.pend { background: #ffe9e4; color: #8d2116; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: .3rem .8rem; font-size: .92rem; margin: 0; }
.kv dt { color: var(--paper-muted); }
.kv dd { margin: 0; font-weight: 600; }
.stars { display: inline-flex; gap: 2px; vertical-align: middle; }
.stars .ic { fill: var(--amber); stroke: #c98a00; stroke-width: 1.2; }
.stars .ic.off { fill: none; stroke: #b5ad9b; }
.side .actions-col { display: flex; flex-direction: column; gap: .5rem; margin-top: auto; }
.side .lockmsg { font-size: .9rem; color: var(--paper-muted); background: var(--paper-2); border-radius: 10px; padding: .6rem .8rem; }

/* ---------- pantalla de juego ---------- */
.play { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.02fr) minmax(0, 1fr); gap: 1rem; padding: .8rem 1.2rem 1rem; }
.play.nofig { grid-template-columns: minmax(0, 1fr); max-width: 64rem; width: 100%; margin: 0 auto; }
.play.wide { grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); }
.play.narrowfig { grid-template-columns: minmax(0, .72fr) minmax(0, 1.28fr); }
.card { background: var(--paper); color: var(--paper-ink); border-radius: var(--r); min-height: 0; box-shadow: 0 10px 30px rgba(0, 0, 0, .25); }
.visual { display: flex; align-items: center; justify-content: center; padding: .9rem; overflow: hidden; position: relative;
  background-image: linear-gradient(rgba(27, 34, 51, .045) 1px, transparent 1px), linear-gradient(90deg, rgba(27, 34, 51, .045) 1px, transparent 1px); background-size: 1.25rem 1.25rem; }
.visual > .fig, .visual > div > .fig { max-width: 100%; max-height: 100%; }
.visual .fig { width: 100%; height: 100%; }
.task { display: flex; flex-direction: column; padding: 1rem 1.3rem 1rem; }
.task-head { display: flex; align-items: center; gap: .6rem; font-size: .8rem; color: var(--paper-muted); margin-bottom: .35rem; flex-wrap: wrap; }
.task-head .tag { background: var(--paper-2); border: 1px solid var(--paper-line); border-radius: 999px; padding: .1rem .6rem; }
.task-head .num { font-weight: 700; color: var(--violet-ink); text-transform: uppercase; letter-spacing: .1em; }
.consigna { font-size: 1.12rem; font-weight: 500; line-height: 1.38; margin: 0 0 .8rem; outline: none; }
.answer { flex: 1; min-height: 0; overflow: auto; padding: 2px 4px 4px 2px; }
.feedback { border-radius: 12px; padding: .65rem .85rem; margin-top: .6rem; font-size: .95rem; display: none; gap: .6rem; align-items: flex-start; }
.feedback.show { display: flex; }
.feedback .ic { margin-top: .1rem; }
.feedback.ok { background: var(--ok-bg); color: #0a5338; border: 1px solid #a8dcc1; }
.feedback.bad { background: var(--bad-bg); color: #7d1a14; border: 1px solid #f2b6ad; }
.feedback.hint { background: var(--hint-bg); color: var(--hint); border: 1px solid #ecd08f; }
.feedback.sol { background: #ecebff; color: #2c2380; border: 1px solid #c8c2ff; }
.feedback .fb-body { flex: 1; }
.feedback .fb-body p { margin: 0; }
.feedback .fb-body p + p { margin-top: .3rem; }
.fb-title { font-weight: 700; }
.actions { display: flex; align-items: center; gap: .6rem; margin-top: .7rem; padding-top: .7rem; border-top: 1px dashed var(--paper-line); }
.actions .spacer { flex: 1; }
.attempts { font-size: .82rem; color: var(--paper-muted); }
.xpgain { font-family: var(--font-d); font-weight: 700; color: var(--amber-ink); background: #fff1cf; border-radius: 999px; padding: .2rem .7rem; animation: pop .4s ease; }
@keyframes pop { 0% { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.12); } 100% { transform: scale(1); opacity: 1; } }

/* opciones */
.opts { display: flex; flex-direction: column; gap: .5rem; }
.opt { display: flex; align-items: center; gap: .7rem; text-align: left; width: 100%; padding: .55rem .8rem; min-height: 2.9rem; border-radius: 12px; border: 2px solid var(--paper-line); background: #fff; cursor: pointer; color: var(--paper-ink); position: relative; transition: border-color .12s, background-color .12s; }
.opt:hover:not(:disabled) { border-color: #a59c86; }
.opt-l { flex: none; width: 1.8rem; height: 1.8rem; border-radius: 8px; display: grid; place-items: center; background: var(--paper-2); font-weight: 700; font-size: .9rem; }
.opt-t { flex: 1; }
.opt-box { flex: none; width: 1.4rem; height: 1.4rem; border-radius: 6px; border: 2px solid #a59c86; background: #fff; }
.opt[aria-checked="true"], .opt[aria-pressed="true"] { border-color: var(--violet-ink); background: #f1efff; }
.opt[aria-checked="true"] .opt-l { background: var(--violet-ink); color: #fff; }
.opt[aria-pressed="true"] .opt-box { background: var(--violet-ink); border-color: var(--violet-ink); box-shadow: inset 0 0 0 3px #fff; }
.opt:disabled { cursor: default; }
.is-ok { border-color: var(--ok) !important; background: var(--ok-bg) !important; }
.is-bad { border-color: var(--bad) !important; background: var(--bad-bg) !important; }
.is-reveal { box-shadow: 0 0 0 3px #8f82ff; }
.mk { flex: none; display: inline-flex; }
.is-ok > .mk { color: var(--ok); }
.is-bad > .mk { color: var(--bad); }
.mk .ic { width: 1.35rem; height: 1.35rem; stroke-width: 3; }

/* números */
.nfields { display: flex; flex-direction: column; gap: .55rem; }
.nf { display: flex; align-items: center; gap: .8rem; padding: .45rem .6rem .45rem .8rem; border-radius: 12px; border: 2px solid transparent; background: var(--paper-2); }
.nf-et { flex: 1; font-weight: 500; }
.nf-in { display: flex; align-items: center; gap: .45rem; }
.nf input { width: 6.5rem; height: 2.6rem; border-radius: 10px; border: 2px solid #c3baa6; background: #fff; padding: 0 .7rem; font-size: 1.12rem; font-weight: 600; text-align: right; color: var(--paper-ink); }
.nf input:focus { border-color: var(--violet-ink); outline: none; box-shadow: 0 0 0 3px rgba(74, 59, 208, .2); }
.nf-suf { color: var(--paper-muted); min-width: 1rem; }
.unit, .sel-row select { height: 2.6rem; border-radius: 10px; border: 2px solid #c3baa6; background: #fff; padding: 0 .5rem; color: var(--paper-ink); }
.unit:focus, .sel-row select:focus { border-color: var(--violet-ink); outline: none; }

/* clasificar */
.cl-list { display: flex; flex-direction: column; gap: .45rem; }
.cl-list.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem .7rem; }
.cl-row { display: flex; align-items: center; gap: .7rem; padding: .4rem .55rem; border-radius: 12px; border: 2px solid transparent; background: var(--paper-2); }
.two-col .cl-row { padding: .3rem .5rem; gap: .5rem; }
.two-col .cl-t { min-width: 0; font-size: .92rem; }
.two-col .seg-b { padding: .25rem .55rem; font-size: .82rem; min-height: 2.1rem; }
.cl-t { flex: 1; display: flex; align-items: center; gap: .55rem; font-weight: 500; min-width: 9rem; }
.cl-t .mini { width: 3.3rem; height: 2.5rem; flex: none; }
.seg { display: flex; gap: .3rem; flex-wrap: wrap; }
.seg-b { border: 2px solid #c3baa6; background: #fff; border-radius: 999px; padding: .3rem .7rem; min-height: 2.3rem; cursor: pointer; font-size: .88rem; color: var(--paper-ink); }
.seg-b[aria-pressed="true"] { background: var(--violet-ink); border-color: var(--violet-ink); color: #fff; }
.seg-b:disabled { cursor: default; }
.seg-b.is-reveal { box-shadow: 0 0 0 3px #8f82ff; }

/* completar */
.sel-list { display: flex; flex-direction: column; gap: .45rem; }
.sel-list.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem .7rem; }
.sel-row { display: flex; align-items: center; gap: .6rem; padding: .25rem .7rem; border-radius: 12px; border: 2px solid transparent; background: var(--paper-2); }
.sel-t { flex: 1; line-height: 1.95; }
.sel-row select { margin: 0 .2rem; max-width: 100%; }

/* ordenar */
.order { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .45rem; }
.order-i { display: flex; align-items: center; gap: .7rem; padding: .5rem .6rem; border-radius: 12px; border: 2px solid var(--paper-line); background: #fff; }
.order-n { flex: none; width: 1.9rem; height: 1.9rem; border-radius: 50%; display: grid; place-items: center; background: var(--violet-ink); color: #fff; font-weight: 700; }
.order-t { flex: 1; }
.order-btns { display: flex; gap: .3rem; }

/* cuadrícula */
.gridwrap { display: flex; flex-direction: column; gap: .6rem; width: 100%; height: 100%; align-items: center; justify-content: center; }
.gridboard { display: grid; gap: 0; height: auto; max-height: calc(100% - 3.2rem); width: min(100%, 40rem); border: 2px solid #9d9481; background: #fff; }
.gcell { aspect-ratio: 1; border: 1px solid #d7d0bf; background: #fff; padding: 0; cursor: pointer; border-radius: 0; }
.gcell[aria-pressed="true"] { background: #ff7cc8; border-color: #c94d97; }
.gcell:focus-visible { outline: 3px solid var(--violet-ink); outline-offset: -3px; position: relative; z-index: 1; }
.gridboard.locked .gcell { cursor: default; }
.gridboard.is-ok { border-color: var(--ok); box-shadow: 0 0 0 3px #a8dcc1; }
.gridboard.is-bad { border-color: var(--bad); box-shadow: 0 0 0 3px #f2b6ad; }
.gridbar { display: flex; gap: .7rem; align-items: center; }
.refbox { display: flex; align-items: center; gap: .9rem; background: var(--paper-2); border-radius: 12px; padding: .6rem .8rem; }
.refbox .fig { width: 6.5rem; height: auto; }
.ref-t { font-weight: 600; font-size: .9rem; }
.ref-d { font-size: .9rem; color: var(--paper-muted); }

/* compás virtual y punto */
.tri-fig, .pt-fig, .hunt-fig { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
.tri-panel { display: flex; flex-direction: column; gap: .7rem; }
.tri-lab { font-size: 1.1rem; }
.tri-range { display: flex; align-items: center; gap: .6rem; }
.tri-range input { flex: 1; accent-color: var(--violet-ink); height: 2rem; }
.tri-st { margin: 0; padding: .5rem .7rem; border-radius: 10px; background: var(--paper-2); font-size: .92rem; }
.pt-tab { border-collapse: collapse; font-size: 1.05rem; }
.pt-tab th { text-align: left; padding: .3rem 1rem .3rem 0; font-weight: 500; color: var(--paper-muted); }
.pt-tab td { font-family: var(--font-d); font-weight: 700; font-size: 1.15rem; }
.pt-help { font-size: .9rem; color: var(--paper-muted); }
.pt-d { cursor: grab; outline: none; }
.pt-d:focus .pt-halo { stroke: var(--violet-ink); stroke-width: 3; }
.pt-halo { fill: rgba(74, 59, 208, .12); stroke: rgba(74, 59, 208, .45); stroke-width: 1.5; }

/* juego cazadores */
.hunt-panel { display: flex; flex-direction: column; gap: .7rem; }
.hunt-top { display: flex; gap: .5rem; flex-wrap: wrap; }
.hunt-die { display: flex; align-items: center; gap: .9rem; }
.hunt-die .fig { width: 4.4rem; height: 4.4rem; }
.hunt-dtxt { font-size: 1.15rem; }
.hunt-opts { display: flex; flex-direction: column; gap: .45rem; }
.hunt-goal { margin: 0; font-size: 1.02rem; background: #f1efff; border-radius: 10px; padding: .55rem .75rem; }
.hunt-msg { font-size: .95rem; border-radius: 10px; }
.hunt-msg.ok { background: var(--ok-bg); color: #0a5338; padding: .55rem .75rem; }
.hunt-msg.bad { background: var(--bad-bg); color: #7d1a14; padding: .55rem .75rem; }
.hunt-end h3 { margin: 0 0 .3rem; font-family: var(--font-d); }
.hunt-end p { margin: .2rem 0; }
.hunt-svg .hshape rect { stroke: rgba(0, 0, 0, .35); stroke-width: 1; }
.hunt-svg.finding .hshape[role=button] { cursor: pointer; }
.hunt-svg.finding .hshape[role=button]:hover rect { filter: brightness(1.12); stroke: #111; stroke-width: 2; }
.hshape:focus { outline: none; }
.hshape:focus rect { stroke: #111; stroke-width: 3; }
.hshape.used rect { opacity: .28; }
.hshape.hl rect { stroke: #111; stroke-width: 3; }
.xline { stroke: #111; stroke-width: 3; stroke-linecap: round; }
.die { fill: #fff; stroke: #1b2233; stroke-width: 2.5; }
.die-empty { fill: #f2ede1; stroke-dasharray: 5 4; }
.pip { fill: #1b2233; }

/* autoevaluación */
.self-list { display: flex; flex-direction: column; gap: .45rem; }
.self-i { display: flex; align-items: center; gap: .7rem; padding: .5rem .7rem; background: var(--paper-2); border-radius: 12px; }
.self-i input { width: 1.4rem; height: 1.4rem; accent-color: var(--violet-ink); flex: none; }
.self-i label { cursor: pointer; }
.self-badge { display: inline-flex; gap: .35rem; align-items: center; font-size: .82rem; background: #ecebff; color: #2c2380; border-radius: 999px; padding: .15rem .6rem; }

/* ---------- introducción a la misión ---------- */
.intro { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1rem; padding: .8rem 1.2rem 1rem; }
.intro .task { gap: .2rem; }
.intro h2 { font-family: var(--font-d); font-size: 1.8rem; margin: 0 0 .2rem; line-height: 1.1; }
.goal { display: flex; gap: .6rem; background: #f1efff; color: #2c2380; border-radius: 12px; padding: .6rem .8rem; margin: .4rem 0 .6rem; }
.goal .ic { color: var(--violet-ink); margin-top: .15rem; }
.concepts { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: .45rem; }
.concepts li { display: flex; gap: .55rem; }
.concepts li::before { content: ''; flex: none; width: .55rem; height: .55rem; margin-top: .5rem; border-radius: 2px; background: var(--cyan-ink); transform: rotate(45deg); }
.example { margin-top: .7rem; padding: .6rem .8rem; border-left: 4px solid var(--amber); background: #fff7e3; border-radius: 0 10px 10px 0; font-size: .95rem; }
.example b:first-child { display: block; font-size: .78rem; text-transform: uppercase; letter-spacing: .12em; color: var(--amber-ink); }
.links { font-size: .85rem; margin-top: .5rem; }
.links a { color: var(--violet-ink); }
.intro .actions { margin-top: auto; }

/* ---------- fin de misión ---------- */
.endwrap { flex: 1; min-height: 0; display: grid; place-items: center; padding: 1rem; }
.endcard { width: min(56rem, 100%); padding: 1.6rem 2rem; text-align: center; position: relative; overflow: hidden; }
.endcard h2 { font-family: var(--font-d); font-size: 2rem; margin: .2rem 0; }
.bigstars { display: flex; justify-content: center; gap: .6rem; margin: .6rem 0; }
.bigstars .ic { width: 3.4rem; height: 3.4rem; fill: var(--amber); stroke: #c98a00; stroke-width: 1; }
.bigstars .ic.off { fill: #ece6d8; stroke: #c4bba6; }
.bigstars .ic.on { animation: starpop .5s ease both; }
.bigstars .ic.on:nth-child(2) { animation-delay: .15s; }
.bigstars .ic.on:nth-child(3) { animation-delay: .3s; }
@keyframes starpop { 0% { transform: scale(0) rotate(-40deg); } 70% { transform: scale(1.2) rotate(8deg); } 100% { transform: scale(1); } }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: .7rem; margin: 1rem 0; }
.stat { background: var(--paper-2); border-radius: 12px; padding: .7rem; }
.stat .v { font-family: var(--font-d); font-size: 1.6rem; font-weight: 700; }
.stat .k { font-size: .82rem; color: var(--paper-muted); }
.crit { font-size: .88rem; color: var(--paper-muted); margin: .3rem 0 .9rem; }
.endmsg { font-size: 1.05rem; margin: .4rem 0; }
.newbadges { display: flex; justify-content: center; gap: .8rem; flex-wrap: wrap; margin: .5rem 0; }
.unlock { display: inline-flex; align-items: center; gap: .5rem; background: #fff1cf; color: var(--amber-ink); font-weight: 600; padding: .4rem .9rem; border-radius: 999px; animation: pop .5s ease .4s both; }
.endcard .row { justify-content: center; margin-top: 1rem; }

/* ---------- insignias ---------- */
.badges { display: grid; grid-template-columns: repeat(4, 1fr); gap: .7rem; }
.badge { display: flex; gap: .7rem; align-items: center; padding: .6rem .75rem; border-radius: 12px; background: var(--paper-2); border: 2px solid transparent; text-align: left; }
.badge .bic { flex: none; width: 3rem; height: 3rem; border-radius: 50%; display: grid; place-items: center; background: #e3ddcf; color: #8a8270; }
.badge .bic .ic { width: 1.6rem; height: 1.6rem; }
.badge.on { border-color: #e9c26b; background: #fff7e3; }
.badge.on .bic { background: radial-gradient(circle at 35% 30%, #ffd977, #f0a400); color: #3a2600; box-shadow: 0 0 0 3px #fff, 0 0 0 5px #f0b23c; }
.badge .bn { font-weight: 700; font-size: .92rem; line-height: 1.15; }
.badge .bd { font-size: .78rem; color: var(--paper-muted); }
.badge-mini { display: inline-flex; flex-direction: column; align-items: center; gap: .3rem; font-weight: 600; font-size: .9rem; animation: pop .5s ease .5s both; }
.badge-mini .bic { width: 3.6rem; height: 3.6rem; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, #ffd977, #f0a400); color: #3a2600; box-shadow: 0 0 0 3px #fff, 0 0 0 5px #f0b23c; }
.badge-mini .bic .ic { width: 1.9rem; height: 1.9rem; }

/* ---------- informe ---------- */
.report { flex: 1; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: .6rem; padding: .8rem 1.2rem 1rem; }
.tabs { display: flex; gap: .4rem; }
.tab { border: 0; background: rgba(255, 255, 255, .08); color: var(--text); padding: .5rem 1.1rem; border-radius: 999px; cursor: pointer; font-weight: 600; }
.tab[aria-selected="true"] { background: var(--paper); color: var(--paper-ink); }
.rpanel { padding: 1rem 1.3rem; overflow: auto; }
.rgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: .65rem; }
.rgrid .stat .v { font-size: 1.4rem; }
.rhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; margin-bottom: .8rem; }
.rhead h2 { margin: 0; font-family: var(--font-d); font-size: 1.5rem; }
.rhead .meta { color: var(--paper-muted); font-size: .9rem; }
table.rt { width: 100%; border-collapse: collapse; font-size: .84rem; }
.rt th { text-align: left; font-size: .76rem; text-transform: uppercase; letter-spacing: .06em; color: var(--paper-muted); padding: .35rem .5rem; border-bottom: 2px solid var(--paper-line); }
.rt td { padding: .32rem .5rem; border-bottom: 1px solid var(--paper-line); vertical-align: top; }
.rt td.rec { font-size: .78rem; color: var(--paper-muted); }
.rt td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lvl { display: inline-flex; align-items: center; gap: .3rem; font-weight: 600; font-size: .8rem; padding: .12rem .55rem; border-radius: 999px; white-space: nowrap; }
.lvl.c { background: var(--ok-bg); color: var(--ok); }
.lvl.p { background: #fff1cf; color: var(--amber-ink); }
.lvl.a { background: #ffe6e2; color: #8d2116; }
.lvl.s { background: #eceae4; color: #5a5f6d; }
.cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.rlist { margin: .3rem 0 0; padding-left: 1.1rem; }
.rlist li { margin-bottom: .35rem; }
.rnote { font-size: .8rem; color: var(--paper-muted); margin-top: .7rem; }
.rbar { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
.rbar .spacer { flex: 1; }
.sendst { font-size: .9rem; color: var(--muted); }
.sendst.ok { color: #9ff0c9; }
.sendst.bad { color: #ffb4a9; }
h3.rsub { font-size: 1rem; margin: .2rem 0 .4rem; font-family: var(--font-d); }

/* ---------- reconocimiento final ---------- */
.cert { width: min(60rem, 100%); padding: 2rem 2.4rem; text-align: center; border: 3px double #d7b86c; position: relative; overflow: hidden; }
.cert h2 { font-family: var(--font-d); font-size: 2.3rem; margin: .4rem 0; }
.cert .seal { width: 6rem; height: 6rem; margin: 0 auto; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, #ffd977, #f0a400); box-shadow: 0 0 0 5px #fff, 0 0 0 8px #f0b23c; color: #3a2600; }
.cert .seal .ic { width: 3rem; height: 3rem; }

/* ---------- modal y avisos ---------- */
.modal-back { position: fixed; inset: 0; background: rgba(5, 10, 20, .72); display: grid; place-items: center; z-index: 50; padding: .5rem; animation: fadein .2s ease; }
.modal { width: min(64rem, 100%); max-height: calc(100vh - 1rem); display: flex; flex-direction: column; background: var(--paper); color: var(--paper-ink); border-radius: var(--r); box-shadow: 0 20px 60px rgba(0, 0, 0, .5); }
.modal-h { display: flex; align-items: center; justify-content: space-between; padding: .9rem 1.3rem; border-bottom: 1px solid var(--paper-line); }
.modal-h h2 { margin: 0; font-family: var(--font-d); font-size: 1.35rem; }
.modal-b { padding: .8rem 1.2rem; overflow: auto; }
.modal-f { padding: .8rem 1.3rem; border-top: 1px solid var(--paper-line); display: flex; gap: .6rem; justify-content: flex-end; }
.howto { display: grid; grid-template-columns: repeat(3, 1fr); gap: .9rem; }
.howto section { background: var(--paper-2); border-radius: 12px; padding: .6rem .8rem; }
.howto h3 { margin: 0 0 .4rem; font-size: 1rem; display: flex; gap: .4rem; align-items: center; }
.howto p, .howto li { font-size: .82rem; margin: .12rem 0; line-height: 1.32; }
.howto ul { padding-left: 1.1rem; margin: .2rem 0; }
.teacher { margin-top: .9rem; border: 2px dashed var(--paper-line); border-radius: 12px; padding: .7rem .9rem; }
.teacher summary { cursor: pointer; font-weight: 600; }
.teacher input { height: 2.4rem; border-radius: 8px; border: 2px solid #c3baa6; padding: 0 .6rem; width: 9rem; }
.teacher ul { font-size: .82rem; }
.toggle { display: inline-flex; align-items: center; gap: .5rem; cursor: pointer; }
.toggle input { width: 1.2rem; height: 1.2rem; accent-color: var(--violet-ink); }
.toasts { position: fixed; right: 1rem; bottom: 1rem; display: flex; flex-direction: column; gap: .5rem; z-index: 60; }
.toast { background: var(--paper); color: var(--paper-ink); border-left: 5px solid var(--amber); border-radius: 10px; padding: .7rem 1rem; box-shadow: 0 10px 30px rgba(0, 0, 0, .35); display: flex; gap: .6rem; align-items: center; animation: slidein .3s ease; max-width: 24rem; }
@keyframes slidein { from { transform: translateX(120%); } to { transform: none; } }
.banner { background: #ffe6e2; color: #7d1a14; padding: .4rem 1rem; font-size: .88rem; text-align: center; }

/* confeti */
.confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.confetti i { position: absolute; top: -10px; width: 9px; height: 14px; border-radius: 2px; animation: fall 1.8s ease-in forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(540deg); opacity: .7; } }

/* ---------- figuras SVG ---------- */
.fig { display: block; overflow: visible; }
.fig .gridl { stroke: #d9d3c4; stroke-width: 1; fill: none; }
.fig .gridl-dark { stroke: rgba(27, 34, 51, .35); stroke-width: 1; fill: none; }
.fig .ln { stroke: #1b2233; stroke-width: 2.5; fill: none; stroke-linecap: round; }
.fig .ln-thin { stroke-width: 1.6; }

.fig .ln-dash { stroke-dasharray: 7 6; }
.fig .ln-blue { stroke: #2563eb; }
.fig .ln-coral { stroke: #e0452f; }
.fig .ln-green { stroke: #10915f; }
.fig .ln-violet { stroke: #5b3fe0; }
.fig .ln-amber { stroke: #c27c00; }
.fig .ln-gray { stroke: #8a8f9c; stroke-dasharray: 4 4; }

.fig .dimln { stroke: #5a6072; stroke-width: 1.4; fill: none; }
.fig .tick { stroke: #1b2233; stroke-width: 2; }
.fig .rmark { fill: none; stroke: #1b2233; stroke-width: 1.7; }
.fig .arcl { fill: none; stroke: #1b2233; stroke-width: 2; }
.fig .arc-dot { stroke: #6b7080; stroke-dasharray: 3 4; stroke-width: 1.6; }
.fig .arc-blue { stroke: #2563eb; }
.fig .arc-coral { stroke: #e0452f; stroke-width: 2.5; }

.fig .shape { fill: rgba(63, 214, 198, .22); stroke: #0a6a62; stroke-width: 2.5; stroke-linejoin: round; }
.fig .shape-outline { fill: none; stroke: #1b2233; stroke-width: 2.2; stroke-linejoin: round; }
.fig .shape-dashed { stroke-dasharray: 7 6; stroke: #2563eb; }
.fig .shape-paper { fill: #fff; stroke: #1b2233; }

.fig .shape-lime { fill: #d6ee6a; stroke: #4d6b00; }
.fig .shape-violet { fill: #c9a6e6; stroke: #5a2c86; }
.fig .shape-blue { fill: #8cc8ff; stroke: #1d5fa8; }
.fig .shape-sky { fill: #cfe6ff; stroke: #2a6db8; }
.fig .shape-amber { fill: #ffd98a; stroke: #a76a00; }
.fig .shape-amber-soft { fill: rgba(255, 191, 60, .3); stroke: none; }
.fig .shape-pink { fill: #ffc2dc; stroke: #b0336f; }
.fig .shape-lemon { fill: #f5f2a0; stroke: #1b2233; }
.fig .shape-gray { fill: #cfd2d6; stroke: #1b2233; }
.fig .shape-coral-soft { fill: rgba(255, 109, 94, .28); stroke: #b3261e; }
.fig .cell { stroke: #1b2233; stroke-width: 1.2; }
.fig .cell-cyan { fill: #6fd3f2; }
.fig .cell-pink { fill: #ff8fc9; }
.fig .cell-violet { fill: #a84ee0; }
.fig .cell-sky { fill: #7fb2e6; }

.fig .lbl { font-family: var(--font); font-size: 15px; font-weight: 500; fill: #1b2233; }
.fig .lbl-s { font-size: 13.5px; }

.fig .lbl-violet { fill: #4a3bd0; }

.fig .lbl-tag { font-weight: 700; font-size: 16px; fill: #fff; paint-order: stroke; stroke: #4a3bd0; stroke-width: 8px; stroke-linejoin: round; }
.fig .lbl-tag2 { font-weight: 700; font-size: 20px; fill: #4a3bd0; }
.fig .dimtx { fill: #4b5163; }
.fig .dot { fill: #1b2233; }
.fig .dot-violet { fill: #5b3fe0; }
.fig .dot-amber { fill: #d48a00; stroke: #1b2233; stroke-width: 1.5; }
.fig .rail { stroke: #5b6275; stroke-width: 9; stroke-linecap: round; }
.fig .rail-ties { stroke: #fbf8f1; stroke-width: 3; stroke-dasharray: 3 9; }
.fig .wall { fill: #d9cfbd; stroke: #8b7f68; stroke-width: 1.5; }
.fig .tree { fill: #2e8b4e; stroke: #1f5e35; stroke-width: 1.5; }
.fig .trunk { fill: #7a4f2a; }
.anim-shift { animation: shift 4.5s ease-in-out infinite; }
@keyframes shift { 0%, 25% { transform: translateX(0); } 55%, 85% { transform: translateX(200px); } 100% { transform: translateX(0); } }
.anim-fade { animation: fadeinout 4.5s ease-in-out infinite; }
@keyframes fadeinout { 0%, 20% { opacity: 0; } 45%, 85% { opacity: 1; } 100% { opacity: 0; } }

/* sin animaciones (preferencia del sistema o ajuste de la app) */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; transition: none !important; }
  .anim-shift { animation: none !important; transform: translateX(200px); }
  .anim-fade { animation: none !important; opacity: 1; }
}
body.no-anim *, body.no-anim *::before, body.no-anim *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; transition: none !important; }
body.no-anim .anim-shift { animation: none !important; transform: translateX(200px); }
body.no-anim .anim-fade { animation: none !important; opacity: 1; }
body.no-anim .confetti { display: none; }

/* pantallas más bajas: compactar */
@media (max-height: 620px) {
  .topbar { min-height: 2.9rem; padding: .35rem 1rem; }
  .play, .intro, .mapwrap { padding-top: .5rem; padding-bottom: .6rem; }
  .consigna { margin-bottom: .5rem; }
}
@media (max-width: 1100px) {
  .mapwrap { grid-template-columns: minmax(0, 1fr) 18rem; }
  .welcome { padding: 1.5rem 2rem; }
  .badges { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 820px) {
  body { overflow: auto; }
  #app { height: auto; min-height: 100vh; }
  .play, .play.wide, .intro, .mapwrap, .welcome, .cols2 { grid-template-columns: 1fr; }
  .visual { min-height: 16rem; }
  .map { min-height: 30rem; }
  .stats, .rgrid { grid-template-columns: 1fr 1fr; }
  .howto { grid-template-columns: 1fr; }
}

/* impresión del informe */
@media print {
  body { background: #fff; color: #000; overflow: visible; height: auto; }
  #app { height: auto; }
  .topbar, .tabs, .rbar, .toasts, .banner { display: none !important; }
  .report { display: block; padding: 0; }
  .rpanel { display: block !important; box-shadow: none; overflow: visible; padding: 0 0 1rem; page-break-inside: avoid; }
  .card { box-shadow: none; }
}

/* ---------- modo evaluación ---------- */
.step.done { background: var(--cyan); }
.node-done { position: absolute; top: -.3rem; right: -.3rem; width: 1.6rem; height: 1.6rem; border-radius: 50%; background: var(--cyan); color: var(--night); display: grid; place-items: center; }
.node-done .ic { width: .95rem; height: .95rem; stroke-width: 3; }
.map .zone { font-size: .78rem; letter-spacing: .04em; text-transform: none; color: var(--muted); max-width: 11rem; white-space: normal; text-align: center; }
.intro.intro-one { grid-template-columns: minmax(0, 1fr); max-width: 60rem; width: 100%; margin: 0 auto; }
.evalnote { display: flex; gap: .6rem; background: #fff2d3; color: #6e4700; border: 1px solid #ecd08f; border-radius: 12px; padding: .6rem .8rem; margin-top: .8rem; font-size: .95rem; }
.evalnote .ic { margin-top: .15rem; }
.sendst-dark { font-size: .9rem; color: var(--paper-muted); margin-top: .8rem; min-height: 1.2em; }
.sendst-dark.ok { color: var(--ok); }
.sendst-dark.bad { color: var(--bad); }
.rt-det td { font-size: .8rem; }
.rt-det td:nth-child(2) { width: 34%; }
@media print { .rpanel[hidden] { display: block !important; } }
.intro h2 { font-size: 1.6rem; }

  <script>
/* =========================================================
   figures.js — Ayudantes para dibujar figuras geométricas en SVG
   Todas las figuras se generan como texto SVG (sin dependencias).
   Convención de ángulos: grados, sentido antihorario, 0° = derecha.

(function (global) {
  'use strict';
  var D2R = Math.PI / 180;

  function r(n) { return Math.round(n * 100) / 100; }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
  function norm(a) { a = a % 360; return a < 0 ? a + 360 : a; }
  /** punto a distancia d desde (x,y) en dirección a (grados) */
  function P(x, y, d, a) { return [x + d * Math.cos(a * D2R), y - d * Math.sin(a * D2R)]; }
  /** dirección (grados) desde V hacia Q */
  function dir(V, Q) { return norm(Math.atan2(-(Q[1] - V[1]), Q[0] - V[0]) / D2R); }
  function dist(A, B) { return Math.hypot(B[0] - A[0], B[1] - A[1]); }
  function mid(A, B) { return [(A[0] + B[0]) / 2, (A[1] + B[1]) / 2]; }

    P: P, dir: dir, dist: dist, mid: mid, norm: norm,

    svg: function (w, h, inner, label, cls) {

        esc(label || 'Figura geométrica') + '" preserveAspectRatio="xMidYMid meet">' + inner + '</svg>';

    grid: function (x, y, cols, rows, s, cls) {

      for (var j = 0; j <= rows; j++) d += 'M' + r(x) + ' ' + r(y + j * s) + 'H' + r(x + cols * s);

    },
    seg: function (A, B, cls) {
      return '<line class="' + (cls || 'ln') + '" x1="' + r(A[0]) + '" y1="' + r(A[1]) + '" x2="' + r(B[0]) + '" y2="' + r(B[1]) + '"/>';
    },
    /** semirrecta con flecha en B */
    ray: function (A, B, cls) {

    },
    /** recta con flechas en ambos extremos */
    line2: function (A, B, cls) {
      return '<line class="' + (cls || 'ln') + '" x1="' + r(A[0]) + '" y1="' + r(A[1]) + '" x2="' + r(B[0]) + '" y2="' + r(B[1]) + '" marker-start="url(#gg-arrow)" marker-end="url(#gg-arrow)"/>';
    },
    poly: function (list, cls, extra) {
      return '<polygon class="' + (cls || 'shape') + '" points="' + pts(list) + '"' + (extra || '') + '/>';
    },
    pline: function (list, cls) { return '<polyline class="' + (cls || 'ln') + '" points="' + pts(list) + '"/>'; },
    path: function (d, cls) { return '<path class="' + (cls || 'ln') + '" d="' + d + '"/>'; },
    text: function (x, y, t, cls, anchor) {
      return '<text class="' + (cls || 'lbl') + '" x="' + r(x) + '" y="' + r(y) + '" text-anchor="' + (anchor || 'middle') + '" dominant-baseline="central">' + t + '</text>';
    },
    rect: function (x, y, w, h, cls) { return '<rect class="' + (cls || 'shape') + '" x="' + r(x) + '" y="' + r(y) + '" width="' + r(w) + '" height="' + r(h) + '"/>'; },
    circle: function (c, rad, cls) { return '<circle class="' + (cls || 'ln') + '" cx="' + r(c[0]) + '" cy="' + r(c[1]) + '" r="' + r(rad) + '"/>'; },
    /** sector circular (ángulo coloreado) de a1 a a2 en sentido antihorario */
    sector: function (V, rad, a1, a2, cls) {

    },
    arc: function (V, rad, a1, a2, cls) {

    /** etiqueta ubicada en la bisectriz de un ángulo */
    angLabel: function (V, rad, a1, a2, t, cls) {

    /** marca de ángulo recto en V entre la dirección a y a+90 */
    right: function (V, a, s, cls) {

    ticks: function (A, B, n, cls) {

    },
    dot: function (p, label, dx, dy, cls) {
      return '<circle class="' + (cls || 'dot') + '" cx="' + r(p[0]) + '" cy="' + r(p[1]) + '" r="4.5"/>' +
        (label ? F.text(p[0] + (dx || 0), p[1] + (dy == null ? -14 : dy), label, 'lbl') : '');
    },
    /** línea de cota con flechas y texto, desplazada "off" px del segmento AB */
    dim: function (A, B, label, off, cls) {
      var a = dir(A, B), o = off || 0;
      var A2 = P(A[0], A[1], o, a + 90), B2 = P(B[0], B[1], o, a + 90);
      var m = mid(A2, B2), lp = P(m[0], m[1], o >= 0 ? 13 : -13, a + 90);
      return F.line2(A2, B2, cls || 'dimln') + F.text(lp[0], lp[1], label, 'lbl lbl-s dimtx');
    },
    /** etiqueta junto al medio de un segmento, del lado indicado (+1 izquierda del sentido A→B, -1 derecha) */
    sideLabel: function (A, B, t, side, d, cls) {
      var a = dir(A, B), m = mid(A, B), p = P(m[0], m[1], (d || 16) * (side || 1), a + 90);
      return F.text(p[0], p[1], t, cls || 'lbl lbl-s');
    },
    /** celdas de cuadrícula */
    cells: function (list, x0, y0, s, cls) {
      return list.map(function (c) { return F.rect(x0 + c[0] * s, y0 + c[1] * s, s, s, cls || 'cell'); }).join('');
    },
    /** vértice superior de un triángulo con base B→C y ángulos dados en B y C */
    triApex: function (B, C, angB, angC) {
      var L = dist(B, C), A = 180 - angB - angC;
      var AB = L * Math.sin(angC * D2R) / Math.sin(A * D2R);
      return P(B[0], B[1], AB, dir(B, C) + angB);
    },
    /** cuadrilátero con ángulos interiores dados (en orden) y dos primeros lados */
    quadFromAngles: function (start, angles, L1, L2, heading) {
      var h0 = heading || 0;
      var h1 = h0 + 180 - angles[1], h2 = h1 + 180 - angles[2], h3 = h2 + 180 - angles[3];
      function u(h) { return [Math.cos(h * D2R), Math.sin(h * D2R)]; }
      var u0 = u(h0), u1 = u(h1), u2 = u(h2), u3 = u(h3);
      var rx = -(L1 * u0[0] + L2 * u1[0]), ry = -(L1 * u0[1] + L2 * u1[1]);
      var det = u2[0] * u3[1] - u3[0] * u2[1];
      var L3 = (rx * u3[1] - u3[0] * ry) / det, L4 = (u2[0] * ry - rx * u2[1]) / det;
      var V0 = start, V1 = P(V0[0], V0[1], L1, h0), V2 = P(V1[0], V1[1], L2, h1), V3 = P(V2[0], V2[1], L3, h2);
      return { pts: [V0, V1, V2, V3], L3: L3, L4: L4 };
    },
    /** escala y centra una lista de puntos dentro de un rectángulo */
    fit: function (list, x, y, w, h) {
      var xs = list.map(function (p) { return p[0]; }), ys = list.map(function (p) { return p[1]; });
      var minx = Math.min.apply(null, xs), maxx = Math.max.apply(null, xs), miny = Math.min.apply(null, ys), maxy = Math.max.apply(null, ys);
      var k = Math.min(w / (maxx - minx || 1), h / (maxy - miny || 1));
      var ox = x + (w - (maxx - minx) * k) / 2, oy = y + (h - (maxy - miny) * k) / 2;
      return list.map(function (p) { return [ox + (p[0] - minx) * k, oy + (p[1] - miny) * k]; });

    cornerLabel: function (V, Prev, Next, rad, t, cls) {

    },

    circleX: function (A, ra, B, rb) {

      if (d > ra + rb || d < Math.abs(ra - rb) || d === 0) return [];
      var a = (ra * ra - rb * rb + d * d) / (2 * d), h = Math.sqrt(Math.max(0, ra * ra - a * a));
      var mx = A[0] + a * (B[0] - A[0]) / d, my = A[1] + a * (B[1] - A[1]) / d;
      return [[mx + h * (B[1] - A[1]) / d, my - h * (B[0] - A[0]) / d], [mx - h * (B[1] - A[1]) / d, my + h * (B[0] - A[0]) / d]];

        m.map(function (q) { return '<circle class="pip" cx="' + r(c[0] + q[0] * o) + '" cy="' + r(c[1] + q[1] * o) + '" r="' + r(s * 0.085) + '"/>'; }).join('');

  /* ================= MAPA ================= */

  /* ================= MISIÓN ================= */

  const TYPE_LABEL = { choice: 'Elegí una respuesta', multi: 'Marcá todas las correctas', number: 'Calculá', classify: 'Clasificá', select: 'Completá', order: 'Ordená los pasos' };
  function renderChallenge(forceId) {

  function showFb(kind, html) { const fb = $('#fb'); fb.className = 'feedback show ' + kind; fb.innerHTML = F.icon(kind === 'hint' ? 'bulb' : 'help') + '<div class="fb-body">' + html + '</div>'; }
  function confirmAnswer() {
    if (!CUR || CUR.done) return;
    const ch = CUR.ch, resp = CUR.ctrl.get(), res = E.validate(ch, resp);
    if (res.empty) { showFb('hint', '<p>' + res.msg + '</p>'); return; }

      '<div class="stat"><div class="v">' + MIS.filter(complete).length + ' / ' + MIS.length + '</div><div class="k">Misiones completas</div></div></div>' +
      (nuevos.length ? '<div class="newbadges">' + nuevos.map((b) => '<span class="badge-mini"><span class="bic">' + F.icon(b.icono) + '</span>' + esc(b.nombre) + '</span>').join('') + '</div>' : '') +
      (first && nextUnlocked && !allDone ? '<p><span class="unlock">' + F.icon('play') + ' ¡Se habilitó la misión ' + (i + 2) + ': ' + esc(MIS[i + 1].titulo) + '!</span></p>' : '') +

      (allDone ? '<button class="btn btn-primary" data-final>' + F.icon('trophy') + ' Finalizar evaluación</button>' :
        (nextUnlocked && !complete(MIS[i + 1]) ? '<button class="btn btn-primary" data-next>Siguiente misión ' + F.icon('play') + '</button>' : '')) + '</div></section></main>');
    on(root, '[data-exit]', 'click', () => renderMap(i));
    on(root, '[data-map]', 'click', () => renderMap());
    on(root, '[data-next]', 'click', () => startRun(MIS[i + 1]));

  /* ================= FINAL ================= */

  /* ================= INFORME DOCENTE ================= */
  function levelOf(n, logro) {
    if (n < CFG.MIN_ACTIVIDADES_COMENTARIO) return { k: 's', t: 'Sin datos suficientes' };
    if (logro >= CFG.NIVELES.consolidado - EPS) return { k: 'c', t: 'Logro consolidado' };
    if (logro >= CFG.NIVELES.enProceso - EPS) return { k: 'p', t: 'En proceso de consolidación' };
    return { k: 'a', t: 'Requiere acompañamiento' };
  }
  /** nota en escala de 1 a 10: % de logro × 10, con mínimo y redondeo configurables */
  function notaDe(logro) {
    const N = CFG.NOTA, k = Math.pow(10, N.decimales || 0);
    const v = Math.round(logro * N.maxima * k + 1e-9) / k;
    return Math.min(N.maxima, Math.max(N.minima, v));
  }
  function buildReport() {
    const per = {}, order = [], items = [];
    MIS.forEach((m, mi) => {
      const k = m.contenido;
      if (!per[k]) { per[k] = { key: k, nombre: C.contenidos[k].nombre, n: 0, ok: 0, sum: 0, total: 0 }; order.push(per[k]); }
      const ms = S.misiones[m.id];
      m.desafios.forEach((ch) => {
        per[k].total++;
        const r = ms && ms.resp[ch.id];
        items.push({ num: ch.num, mision: (mi + 1) + '. ' + m.titulo, contenido: C.contenidos[k].nombre, consigna: strip(ch.consigna), respuesta: r ? r.resp : '', correcta: correctText(ch), respondida: !!r, ok: r ? r.ok : null, parcial: r ? r.parcial : null });
        if (r) { per[k].n++; per[k].ok += r.ok ? 1 : 0; per[k].sum += r.parcial; }
      });
    });
    order.forEach((p) => { p.logro = p.n ? p.sum / p.n : 0; p.nivel = levelOf(p.n, p.logro); });
    const resp = items.filter((x) => x.respondida), ok = resp.filter((x) => x.ok).length;
    return {
      alias: S.alias, aventura: CFG.NOMBRE_AVENTURA, curso: CFG.CURSO, fecha: new Date().toLocaleString('es-AR'), fechaISO: new Date().toISOString(),
      tiempoMin: Math.round((S.tiempoMs || 0) / 60000), misionesCompletadas: MIS.filter(complete).length,
      respondidas: resp.length, total: items.length, correctas: ok, incorrectas: resp.length - ok,
      pctCorrectas: resp.length ? ok / resp.length : 0, logro: resp.length ? resp.reduce((a, x) => a + x.parcial, 0) / resp.length : 0,
      puntos: Math.round(resp.reduce((a, x) => a + x.parcial, 0) * 100) / 100, logroTotal: resp.reduce((a, x) => a + x.parcial, 0) / items.length,
      nota: MIS.every(complete) ? notaDe(resp.reduce((a, x) => a + x.parcial, 0) / items.length) : null,
      xp: totalXP(), insignias: S.insignias.map((id) => (C.insignias.find((b) => b.id === id) || {}).nombre).filter(Boolean),
      porContenido: order, porMision: MIS.map((m, i) => { const its = items.filter((x) => x.mision.startsWith((i + 1) + '. ')), rs = its.filter((x) => x.respondida); return { n: i + 1, titulo: m.titulo, completa: complete(m), respondidas: rs.length, total: its.length, correctas: rs.filter((x) => x.ok).length, logro: rs.length ? rs.reduce((a, x) => a + x.parcial, 0) / rs.length : 0 }; }),
      items: items, docente: !!S.docente
    };
  }
  function renderTeacher(tab) {
    tab = tab || 'res';
    const R = buildReport();
    const st = (v, k) => '<div class="stat"><div class="v">' + v + '</div><div class="k">' + k + '</div></div>';
    const mark = (x) => !x.respondida ? '<span class="lvl s">Sin responder</span>' : x.ok ? '<span class="lvl c">✓ Correcta</span>' : x.parcial > 0 ? '<span class="lvl p">◐ Parcial (' + pct(x.parcial) + ')</span>' : '<span class="lvl a">✗ Incorrecta</span>';
    const root = screen(topbarMain() + '<main class="report">' +
      '<div class="tabs" role="tablist">' + [['res', 'Resumen'], ['det', 'Respuestas detalladas']].map((t) => '<button class="tab" role="tab" aria-selected="' + (t[0] === tab) + '" data-tab="' + t[0] + '">' + t[1] + '</button>').join('') +
      '<span class="chip chip-amber" style="margin-left:auto">' + F.icon('lock') + ' Vista docente</span></div><div style="min-height:0;display:grid">' +
      '<section class="card paper rpanel" id="rp-res"' + (tab === 'res' ? '' : ' hidden') + '><div class="rhead"><div><h2>Informe de ' + esc(R.alias) + '</h2><div class="meta">' + esc(R.aventura) + ' · ' + esc(R.curso) + ' · ' + esc(R.fecha) + '</div></div><div class="meta" style="text-align:right">Tiempo registrado: <b>' + R.tiempoMin + ' min</b></div></div>' +
      '<div class="rgrid" style="grid-template-columns:repeat(6,1fr)">' + st(R.misionesCompletadas + ' / ' + MIS.length, 'Misiones completas') + st(R.respondidas + ' / ' + R.total, 'Desafíos respondidos') + st(R.correctas + ' / ' + R.incorrectas, 'Correctas / no correctas') + st(pct(R.pctCorrectas) + ' · ' + pct(R.logroTotal), '% correctas · % de logro') + st(E.fmt(R.puntos) + ' / ' + R.total, 'Puntaje') + st(R.nota == null ? '—' : E.fmt(R.nota), 'Nota (1 a 10)') + '</div>' +
      '<div class="cols2" style="margin-top:.7rem"><div><h3 class="rsub">Por contenido</h3><table class="rt"><thead><tr><th>Contenido</th><th>Resp.</th><th>Correctas</th><th>Logro</th><th>Nivel</th></tr></thead><tbody>' +
      R.porContenido.map((p) => '<tr><td>' + esc(p.nombre) + '</td><td class="n">' + p.n + '/' + p.total + '</td><td class="n">' + p.ok + '</td><td class="n">' + (p.n ? pct(p.logro) : '—') + '</td><td><span class="lvl ' + p.nivel.k + '">' + p.nivel.t + '</span></td></tr>').join('') + '</tbody></table></div>' +
      '<div><h3 class="rsub">Por misión</h3><table class="rt"><thead><tr><th>Misión</th><th>Resp.</th><th>Correctas</th><th>Logro</th></tr></thead><tbody>' +
      R.porMision.map((x) => '<tr><td>' + x.n + '. ' + esc(x.titulo) + '</td><td class="n">' + x.respondidas + '/' + x.total + '</td><td class="n">' + x.correctas + '</td><td class="n">' + (x.respondidas ? pct(x.logro) : '—') + '</td></tr>').join('') + '</tbody></table></div></div>' +
      '<p class="rnote"><b>% correctas</b> = desafíos totalmente correctos ÷ respondidos. <b>% de logro</b> = promedio del puntaje de cada desafío, donde los de varias partes (cálculos, clasificar, completar, ordenar) suman la fracción de partes correctas; opción única y múltiple valen 1 o 0. <b>Nota</b> = % de logro sobre los ' + R.total + ' desafíos × 10 (mínimo ' + CFG.NOTA.minima + (CFG.NOTA.decimales ? '' : ', redondeada a entero') + '); se calcula al completar las ' + MIS.length + ' misiones. Niveles: consolidado ≥ ' + pct(CFG.NIVELES.consolidado) + ', en proceso ≥ ' + pct(CFG.NIVELES.enProceso) + '.' + (R.docente ? ' <b>Modo docente activo en este equipo.</b>' : '') + '</p></section>' +
      '<section class="card paper rpanel" id="rp-det"' + (tab === 'det' ? '' : ' hidden') + '><table class="rt rt-det"><thead><tr><th>N.º</th><th>Consigna</th><th>Respuesta del estudiante</th><th>Respuesta correcta</th><th>Resultado</th></tr></thead><tbody>' +
      R.items.map((x) => '<tr><td class="n">' + x.num + '</td><td>' + esc(x.consigna.length > 140 ? x.consigna.slice(0, 140) + '…' : x.consigna) + '</td><td>' + esc(x.respuesta || '—') + '</td><td>' + esc(x.correcta) + '</td><td>' + mark(x) + '</td></tr>').join('') + '</tbody></table></section></div>' +
      '<div class="rbar">' + (MIS.every(complete) && !alreadySent() ? '<button class="btn btn-primary" data-send>' + F.icon('send') + ' Enviar a la planilla</button>' : '') + '<button class="btn btn-ghost" data-print>' + F.icon('print') + ' Imprimir / PDF</button>' +
      '<span class="sendst" id="sendst" role="status">' + sendStatusText() + '</span><div class="spacer"></div><button class="btn btn-ghost" data-map>' + F.icon('map') + ' Salir de la vista docente</button></div></main>');
    wireTop(root);
    on(root, '[data-tab]', 'click', (e) => { const t = e.currentTarget.getAttribute('data-tab'); root.querySelectorAll('[data-tab]').forEach((b) => b.setAttribute('aria-selected', b === e.currentTarget)); root.querySelectorAll('.rpanel').forEach((p) => { p.hidden = p.id !== 'rp-' + t; }); });
    on(root, '[data-map]', 'click', () => renderMap());
    on(root, '[data-print]', 'click', () => { root.querySelectorAll('.rpanel').forEach((p) => { p.hidden = false; }); window.print(); renderTeacher(tab); });
    on(root, '[data-send]', 'click', (e) => sendReport(e.currentTarget));
  }

  /* ================= ENVÍO ================= */
  function configured() { return CFG.APPS_SCRIPT_URL && /^https:\/\/script\.google\.com\//.test(CFG.APPS_SCRIPT_URL) && CFG.GOOGLE_SHEET_ID && !/PEGAR/.test(CFG.GOOGLE_SHEET_ID); }
  function payload() {
    const R = buildReport();
    if (!S.envioId) { S.envioId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2); save(); }
    const id = S.envioId;   // fijo por estudiante: la planilla descarta cualquier envío repetido
    const r1 = (x) => Math.round(x * 1000) / 10;
    return { clave: CFG.CLAVE_ENVIO, sheetId: CFG.GOOGLE_SHEET_ID, envioId: id, version: 'evaluacion-v2',
      alias: R.alias, curso: R.curso, fecha: R.fechaISO, tiempoMin: R.tiempoMin, misionesCompletadas: R.misionesCompletadas,
      respondidas: R.respondidas, total: R.total, correctas: R.correctas, incorrectas: R.incorrectas, pctCorrectas: r1(R.pctCorrectas), logro: r1(R.logroTotal), puntos: R.puntos, nota: R.nota,
      xp: R.xp, insignias: R.insignias.join(', '), modoDocente: R.docente,
      porContenido: R.porContenido.map((p) => ({ contenido: p.nombre, respondidas: p.n, correctas: p.ok, logro: r1(p.logro), nivel: p.nivel.t })),
      porMision: R.porMision.map((x) => ({ mision: x.n + '. ' + x.titulo, completa: x.completa, respondidas: x.respondidas, correctas: x.correctas, logro: r1(x.logro) })),
      respuestas: R.items.map((x) => ({ num: x.num, mision: x.mision, contenido: x.contenido, consigna: x.consigna.slice(0, 300), respuesta: x.respuesta, correcta: x.correcta, resultado: !x.respondida ? 'Sin responder' : x.ok ? 'Correcta' : x.parcial > 0 ? 'Parcial' : 'Incorrecta', puntaje: x.parcial == null ? '' : x.parcial })) };
  }
  let SENDING = false;
  function sendStatusText() {
    const l = (S.envios || []).filter((e) => e.estado === 'recibido' || e.estado === 'sin confirmación').pop();
    if (l) return '✓ Respuestas registradas el ' + new Date(l.t).toLocaleString('es-AR') + (l.estado === 'sin confirmación' ? ' (sin confirmación de la planilla)' : '') + '.';
    if (!MIS.every(complete)) return 'Tus respuestas se enviarán automáticamente al completar las ' + MIS.length + ' misiones.';
    if (!configured()) return 'La docente todavía no configuró la planilla. Tus respuestas quedan guardadas en esta computadora.';
    return 'Tus respuestas todavía no se enviaron.';
  }
  function setStatus(cls, t) { const st = $('#sendst'); if (st) { st.className = (st.classList.contains('sendst-dark') ? 'sendst-dark ' : 'sendst ') + cls; st.textContent = t; } }
  /** envía el resultado UNA sola vez, solo cuando las 8 misiones están completas */
  function sendReport(btn) {
    if (!S || alreadySent() || SENDING || !MIS.every(complete)) return;
    const showBtn = (v) => { const b = btn || $('[data-send]'); if (b) { b.hidden = !v; b.disabled = !v; } };
    if (!configured()) { setStatus('bad', 'La docente todavía no configuró la planilla (archivo config.js). Tus respuestas quedan guardadas en esta computadora.'); showBtn(false); return; }
    if (!navigator.onLine) { setStatus('bad', 'No hay conexión a internet. Conectate y tocá «Reintentar envío».'); showBtn(true); return; }
    SENDING = true; showBtn(false); setStatus('', 'Enviando tus respuestas…');
    const body = JSON.stringify(payload());
    const done = (estado, cls, msg) => {
      SENDING = false;
      if (estado) { S.envios.push({ t: Date.now(), estado: estado }); save(); }
      if (!S || !document.body.contains($('#sendst') || document.body)) return;
      setStatus(cls, msg); showBtn(!estado);
    };
    fetch(CFG.APPS_SCRIPT_URL, { method: 'POST', body: body, redirect: 'follow' }).then((r) => r.json())
      .then((j) => { if (j && j.ok) done('recibido', 'ok', '✓ ¡Respuestas registradas! La planilla confirmó la recepción.'); else done(null, 'bad', 'La planilla respondió con un error: ' + ((j && j.error) || 'desconocido') + '. Avisale a tu docente y tocá «Reintentar envío».'); })
      .catch(() => fetch(CFG.APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: body })
        .then(() => done('sin confirmación', 'ok', '✓ Respuestas enviadas. (El navegador no pudo leer la confirmación: tu docente puede verificar la planilla.)'))
        .catch(() => done(null, 'bad', 'No se pudo enviar. Revisá la conexión y tocá «Reintentar envío».')));
  }

  /* ================= MODALES ================= */
  let lastFocus = null;
  function openModal(title, body, buttons, wide) {
    lastFocus = document.activeElement;
    modalRoot.innerHTML = '<div class="modal-back"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mh"' + (wide ? '' : ' style="width:min(36rem,100%)"') + '>' +
      '<div class="modal-h"><h2 id="mh">' + title + '</h2><button class="ib" data-close aria-label="Cerrar">' + F.icon('x') + '</button></div><div class="modal-b">' + body + '</div>' +
      (buttons && buttons.length ? '<div class="modal-f">' + buttons.map((b, i) => '<button class="btn ' + (b.cls || 'btn-ghost-dark') + '" data-mb="' + i + '">' + esc(b.t) + '</button>').join('') + '</div>' : '') + '</div></div>';
    const back = modalRoot.firstChild;
    back.addEventListener('click', (e) => { if (e.target === back) closeModal(); });
    on(back, '[data-close]', 'click', closeModal);
    on(back, '[data-mb]', 'click', (e) => { const b = buttons[+e.currentTarget.getAttribute('data-mb')]; if (b.keep) { if (b.fn() !== false) closeModal(true); return; } closeModal(); if (b.fn) b.fn(); });
    const f = back.querySelector('input') || back.querySelector('.modal-f .btn:last-child') || back.querySelector('[data-close]'); f.focus();
    return back;
  }
  function closeModal(noRefocus) { modalRoot.innerHTML = ''; if (!noRefocus && lastFocus && document.body.contains(lastFocus)) lastFocus.focus(); }
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modalRoot.firstChild) closeModal();
    if (e.key === 'Tab' && modalRoot.firstChild) {
      const f = modalRoot.querySelectorAll('button, input, select, summary, a[href]'); if (!f.length) return;
      const a = f[0], z = f[f.length - 1];
      if (e.shiftKey && document.activeElement === a) { e.preventDefault(); z.focus(); } else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); }
    }
  });
  function openBadges() {
    openModal('Insignias', '<div class="badges">' + C.insignias.map((b) => { const o = S.insignias.indexOf(b.id) >= 0; return '<div class="badge ' + (o ? 'on' : '') + '"><span class="bic">' + F.icon(b.icono) + '</span><div><div class="bn">' + esc(b.nombre) + '</div><div class="bd">' + (o ? '✓ Obtenida · ' : 'Por obtener · ') + esc(b.desc) + '</div></div></div>'; }).join('') + '</div>', [{ t: 'Cerrar', cls: 'btn-primary' }], true);
  }
  function openHowto() {
    const body = '<div class="howto">' +
      '<section><h3>' + F.icon('map') + ' Cómo avanzar</h3><ul><li>Elegí la misión disponible en el mapa.</li><li>Cada misión se habilita al <b>completar</b> la anterior.</li><li>El desafío final se habilita al completar todas las misiones.</li></ul></section>' +
      '<section><h3>' + F.icon('eye') + ' Es una evaluación</h3><ul><li>Cada desafío se responde <b>una sola vez</b>: después de confirmar no se puede cambiar.</li><li>No vas a ver si tu respuesta es correcta: los resultados los recibe tu docente.</li><li>Los desafíos y las opciones aparecen en orden distinto para cada estudiante.</li></ul></section>' +
      '<section><h3>' + F.icon('star') + ' XP e insignias</h3><ul><li>Cada respuesta suma <b>' + CFG.XP.porRespuesta + ' XP</b> y cada misión completa, <b>' + CFG.XP.misionCompleta + ' XP</b>.</li><li>Al completar cada misión ganás una insignia.</li><li>Los XP no dependen de los aciertos.</li></ul></section>' +
      '<section><h3>' + F.icon('grid') + ' Teclado y panel táctil</h3><ul><li><b>Tab</b> para moverte; <b>Enter</b> o <b>Espacio</b> para elegir.</li><li>En las opciones podés usar las <b>flechas</b>.</li><li>Usá coma decimal: 6,5.</li></ul></section>' +
      '<section><h3>' + F.icon('report') + ' Tus respuestas</h3><ul><li>Se guardan en <b>esta computadora y este navegador</b>.</li><li>Al terminar, se envían a tu docente.</li></ul></section>' +
      '<section><h3>' + F.icon('play') + ' Pantalla</h3><label class="toggle"><input type="checkbox" id="anim-t"' + (animOn() ? ' checked' : '') + '> Animaciones</label></section></div>' +
      '<details class="teacher"><summary>Área docente</summary><div class="row" style="margin-top:.5rem"><input id="tkey" type="password" aria-label="Clave docente" placeholder="Clave docente"><button class="btn btn-small btn-ghost-dark" id="tok">Ingresar</button><span id="tmsg" style="font-size:.85rem"></span></div>' +
      '<div id="tpanel" hidden><div class="row" style="margin-top:.6rem"><button class="btn btn-small btn-primary" id="t-rep">Ver informe con resultados</button><button class="btn btn-small btn-ghost-dark" id="t-unl">' + (S && S.docente ? 'Volver a bloquear misiones' : 'Habilitar todas las misiones') + '</button><button class="btn btn-small btn-ghost-dark" id="t-del">Borrar respuestas de este estudiante</button></div>' +
      '<p style="font-size:.85rem;margin-top:.6rem"><b>Notas sobre las correcciones aplicadas:</b></p><ul>' + C.pendientes.map((p) => '<li>' + p + '</li>').join('') + '</ul></div></details>';
    const back = openModal('¿Cómo funciona?', body, [{ t: '¡Entendido!', cls: 'btn-primary' }], true);
    const at = back.querySelector('#anim-t'); at.addEventListener('change', () => { if (S) { S.anim = at.checked; save(); } applyAnim(); }); if (!S) at.disabled = true;
    const enter = () => {
      if (back.querySelector('#tkey').value !== CFG.CLAVE_DOCENTE) { back.querySelector('#tmsg').textContent = 'Clave incorrecta.'; return; }
      if (!S) { back.querySelector('#tmsg').textContent = 'Primero tiene que ingresar un estudiante.'; return; }
      back.querySelector('#tpanel').hidden = false; back.querySelector('#tmsg').textContent = '';
    };
    back.querySelector('#tok').addEventListener('click', enter);
    back.querySelector('#tkey').addEventListener('keydown', (e) => { if (e.key === 'Enter') enter(); });
    back.querySelector('#t-rep').addEventListener('click', () => { closeModal(true); renderTeacher(); });
    back.querySelector('#t-unl').addEventListener('click', () => { S.docente = !S.docente; save(); closeModal(true); renderMap(); toast(S.docente ? 'Todas las misiones habilitadas en este equipo.' : 'Misiones bloqueadas otra vez.'); });
    back.querySelector('#t-del').addEventListener('click', () => { try { localStorage.removeItem(KEY); } catch (e) { } S = null; closeModal(true); renderWelcome(); });
  }

  /* ================= inicio ================= */
  renderWelcome();
  if (/[?&]test=1/.test(location.search)) {
    window.GG = { get S() { return S; }, MIS: MIS, E: E, buildReport: buildReport, payload: payload, shuffled: shuffled,
      login: (a) => { S = fresh(a || 'Prueba'); save(); renderMap(0); }, startRun: (i) => startRun(MIS[i]), renderTeacher: renderTeacher, renderProgress: renderProgress, renderMap: renderMap, renderFinal: renderFinal,
      get CUR() { return CUR; }, confirm: () => confirmAnswer(),
      open: (mi, ci) => { RUN = { m: MIS[mi], gained: 0 }; mstate(MIS[mi]).orden = MIS[mi].desafios.map((c) => c.id); renderChallenge(MIS[mi].desafios[ci].id); } };
  }
})();

</script>
</body>
</html>
